## ─────────────────────────────────────────────────────────────────────────
## Klipper-HA-Notify — Home Assistant Push-Benachrichtigungen
## https://github.com/Eifel-Joe/Klipper-HA-Notify
##
## Lädt das Python-Extra und registriert den NOTIFY GCode-Befehl.
## Konfiguration (Token, URL, Service) liegt in:
##   ~/printer_data/scripts/klipper_ha_notify.conf
##
## Diese Datei wird durch den Installer nach
##   ~/printer_data/config/ha_notify.cfg
## kopiert und mit dem Druckernamen befüllt.
## ─────────────────────────────────────────────────────────────────────────

[notify_ha]
## Druckername für Push-Benachrichtigungen (Fallback wenn kein TITLE angegeben)
## Standard wenn nicht gesetzt: "Drucker"
# printer_name: Mein Drucker
