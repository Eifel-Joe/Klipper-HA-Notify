## ─────────────────────────────────────────────────────────────────────────
## Klipper-HA-Notify — Home Assistant Push-Benachrichtigungen
## https://github.com/Eifel-Joe/Klipper-HA-Notify
## ─────────────────────────────────────────────────────────────────────────

[gcode_shell_command notify_ha]
command: /home/pi/printer_data/scripts/notify_ha.py
timeout: 10.0
verbose: False

[gcode_macro NOTIFY]
description: Push-Benachrichtigung via Home Assistant — Parameter: TITLE, MESSAGE
gcode:
  {% set title = params.TITLE|default("Drucker")|string %}
  {% set msg   = params.MESSAGE|default("")|string %}
  RUN_SHELL_COMMAND CMD=notify_ha PARAMS="{title}" "{msg}"
